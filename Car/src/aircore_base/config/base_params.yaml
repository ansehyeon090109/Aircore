base_controller:
  ros__parameters:
    serial_port: /dev/ttyUSB0
    baudrate: 115200
    send_rate_hz: 20.0        # keep-alive 포함 송신 주기 (STM32 timeout 300ms)
    cmd_vel_timeout: 0.5      # [s]
    wheel_separation: 0.0     # [m]   미측정 (0.0 = 미설정 → M,0,0만 송신)
    wheel_radius: 0.0         # [m]   미측정 (odometry용)
    ticks_per_rev: 0          #       미측정 (odometry용)
    max_wheel_speed: 0.0      # [m/s] 미측정 (0.0 = 미설정 → M,0,0만 송신), duty 100일 때 바퀴 선속도
    invert_left: false
    invert_right: false
    max_duty: 30              # 첫 주행 테스트용 안전 제한
    dry_run: false

odometry:
  ros__parameters:
    wheel_radius: 0.0         # [m]   미측정 (0.0 = 미설정 → /odom, TF publish 안 함)
    wheel_separation: 0.0     # [m]   미측정
    ticks_per_rev_left: 0     #       미측정 (바퀴 1회전당 카운트)
    ticks_per_rev_right: 0    #       미측정
    invert_enc_left: true     # 전진 시 왼쪽 카운트 감소 (로그로 확인, 재확인 필요)
    invert_enc_right: false
    odom_frame: odom
    base_frame: base_link
    publish_tf: true
